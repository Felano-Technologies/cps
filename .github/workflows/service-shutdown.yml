name: Service Shutdown (after 5pm UTC)

on:
  # Backup times cover delayed or dropped scheduled runs; the check job
  # makes the extra runs no-ops once the backend is already down.
  schedule:
    - cron: '7 17 * * *'
    - cron: '29 17 * * *'
    - cron: '53 17 * * *'
    - cron: '23 18 * * *'
    - cron: '17 19 * * *'
  workflow_dispatch:

concurrency:
  group: railway-services
  cancel-in-progress: false

jobs:
  check:
    name: Check whether services need pausing
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          HOUR=$(date -u +%H)
          # A run delayed into the morning must not take the app down during work hours
          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -lt 17 ]; then
            echo "Outside shutdown window ($HOUR UTC), skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://cps-production-6d97.up.railway.app/health || true)
          echo "Backend health: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  shutdown:
    name: Pause Railway Services
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pause backend
        run: |
          DEPLOYMENT_ID=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn \
              --arg sid "${{ secrets.RAILWAY_SERVICE_ID }}" \
              --arg eid "${{ secrets.RAILWAY_ENVIRONMENT_ID }}" \
              '{query:"query($sid:String!,$eid:String!){deployments(input:{serviceId:$sid,environmentId:$eid},first:1){edges{node{id}}}}",variables:{sid:$sid,eid:$eid}}')" \
            | jq -r '.data.deployments.edges[0].node.id')
          echo "Stopping backend deployment: $DEPLOYMENT_ID"
          curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg id "$DEPLOYMENT_ID" \
              '{query:"mutation($id:String!){deploymentStop(id:$id)}",variables:{id:$id}}')"

      - name: Pause Postgres
        run: |
          DEPLOYMENT_ID=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn \
              --arg sid "${{ secrets.RAILWAY_POSTGRES_SERVICE_ID }}" \
              --arg eid "${{ secrets.RAILWAY_ENVIRONMENT_ID }}" \
              '{query:"query($sid:String!,$eid:String!){deployments(input:{serviceId:$sid,environmentId:$eid},first:1){edges{node{id}}}}",variables:{sid:$sid,eid:$eid}}')" \
            | jq -r '.data.deployments.edges[0].node.id')
          echo "Stopping Postgres deployment: $DEPLOYMENT_ID"
          curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg id "$DEPLOYMENT_ID" \
              '{query:"mutation($id:String!){deploymentStop(id:$id)}",variables:{id:$id}}')"
